<div class="container py-5">
  <div class="card shadow p-4">
    <h2 class="mb-4 text-center">Informations Chauffeur</h2>

    <form id="formChauffeur">
        <div class="mb-3">
            <label for="plaque" class="form-label">Plaque d'immatriculation</label>
            <input type="text" class="form-control" id="plaque" required>
        </div>

        <div class="mb-3">
            <label for="dateImmat" class="form-label">Date de première immatriculation</label>
            <input type="date" class="form-control" id="dateImmat" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Véhicule</label>
            <input type="text" class="form-control mb-2" id="marque" placeholder="Marque" required>
            <input type="text" class="form-control mb-2" id="modele" placeholder="Modèle" required>
            <input type="text" class="form-control mb-2" id="couleur" placeholder="Couleur" required>
        </div>

        <div class="mb-3">
            <label for="places" class="form-label">Nombre de places disponibles</label>
            <input type="number" class="form-control" id="places" min="1" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Préférences</label>
            <div class="form-check">
            <input class="form-check-input" type="checkbox" id="fumeur">
            <label class="form-check-label" for="fumeur">Accepte fumeur</label>
            </div>
            <div class="form-check">
            <input class="form-check-input" type="checkbox" id="animal">
            <label class="form-check-label" for="animal">Accepte animaux</label>
            </div>
        </div>

        <button type="submit" class="btn btn-success w-100">Valider</button>
        </form>
    </div>
    </div>

    </main>
